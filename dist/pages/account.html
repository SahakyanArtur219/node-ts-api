<!DOCTYPE html>
<html lang="en">
<head>
  <title>Account</title>
</head>
<body>
  <div id="account-info">Loading user info...</div>

  <script>
    async function fetchAccount() {
      const token = localStorage.getItem('token');
      if (!token) {
        window.location.href = '/login.html';
        return;
      }
      const res = await fetch('/account', {
        headers: {
          'Authorization': 'Bearer ' + token
        }
      });

      const data = await res.json();
      const div = document.getElementById('account-info');

      if (res.ok) {
        div.textContent = `Welcome, ${data.email}! Your user ID is ${data.id}.`;
      } else {
        div.textContent = 'Failed to load account info. Redirecting to login...';
        setTimeout(() => window.location.href = '/login.html', 2000);
      }
    }

    fetchAccount();
  </script>
</body>
</html>
